      InputParameters:
        cloudformationRoleArn: !GetAtt IamRoleForDriftDetection.Arn

  ConfigRuleToDetectCfnDriftEpsam:
    Condition: ShouldDeployDriftDetection
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-CloudFormationDriftDetector-epsam
      Description: AWS Config rule to detect drift in CloudFormation stacks
      Scope:
        TagKey: cfnDriftDetectionGroup
        TagValue: epsam
      Source:
        Owner: AWS
        SourceIdentifier: CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK
      MaximumExecutionFrequency: TwentyFour_Hours
      InputParameters:
        cloudformationRoleArn: !GetAtt IamRoleForDriftDetection.Arn

  DriftDetectorLambdaInvokePermission:
    Condition: ShouldDeployDriftDetection
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !GetAtt DriftDetector.Arn
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt DriftDetectorChangeRule.Arn

  # EventBridge Rule that triggers lambda when we get an aws.config event for one of our rules
  DriftDetectorChangeRule:
    Condition: ShouldDeployDriftDetection
    Type: "AWS::Events::Rule"
    Properties:
      EventPattern:
        source:
          - "aws.config"
        detail-type:
          - "Config Rules Compliance Change"
        detail:
          configRuleARN:
            - !GetAtt ConfigRuleToDetectCfnDriftPSU.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftCPT.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftCPTUI.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftPrescribeDispense.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftVpcResources.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftDashboards.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftAccountResources.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftPFP.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftFhirValidator.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftRoute53.Arn
            - !GetAtt ConfigRuleToDetectCfnDriftEpsam.Arn
      Targets:
        - Arn: !GetAtt DriftDetector.Arn
          Id: "DriftDetectorFunction"
  #endregion

#region outputs
Outputs:
  #################################################
  # Lambda Insights Outputs
  #################################################
  LambdaInsightsLogGroupPolicy:
  # this is used by eps-storage-terraform so be careful when moving it to cdk
    Description: "Lambda Insights Policy ARN"
    Value: !GetAtt LambdaInsightsLogGroupPolicy.PolicyArn
    Export:
      Name: !Join [":", [!Ref "AWS::StackName", "LambdaInsightsLogGroupPolicy"]]

  ##################################################
  # Splunk Subscription Filter Outputs
  ##################################################
  SplunkSubscriptionFilterRole:
    Description: "SplunkSubscriptionFilterRole ARN"
    Value: !GetAtt SplunkSubscriptionFilterRole.Arn
    Export:
      Name: !Join [":", [!Ref "AWS::StackName", "SplunkSubscriptionFilterRole"]]

  ##################################################
  # Splunk Delivery Stream Outputs
  ##################################################
  SplunkDeliveryStream:
    Description: "SplunkDeliveryStream ARN"
    Value: !GetAtt SplunkDeliveryStream.Arn
    Export:
      Name: !Join [":", [!Ref "AWS::StackName", "SplunkDeliveryStream"]]

  ##################################################
  # Slack Alerter Outputs
  # this is used by other stacks so it needs to be migrated to cdk carefully
  ##################################################
  SlackAlertsSnsTopicArn:
    Description: "SlackAlertsSnsTopic ARN"
    Value: !GetAtt SlackAlertsSnsTopic.TopicArn
    Export:
      Name: !Join [":", [!Ref "AWS::StackName", "SlackAlertsSnsTopicArn"]]
#endregion
