  ##################################################
  #region drift detector
  ##################################################

  # lambda that handles config for drift detection
  DriftDetector:
    Condition: ShouldDeployDriftDetection
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-DriftDetector
      CodeUri: ../packages
      Handler: driftDetector.handler
      Role: !GetAtt DriftDetectorResources.Outputs.LambdaRoleArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
    Metadata:
      BuildMethod: esbuild
      guard:
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        tsconfig: driftDetector/tsconfig.json
        packages: bundle
        EntryPoints:
          - driftDetector/src/driftDetector.ts

  DriftDetectorResources:
    Condition: ShouldDeployDriftDetection
    Type: AWS::Serverless::Application
    Properties:
      Location: common_lambda_resources.yml
      Parameters:
        CloudWatchKMSKey: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
        SplunkSubscriptionFilterRole: !GetAtt SplunkSubscriptionFilterRole.Arn
        SplunkDeliveryStream: !GetAtt SplunkDeliveryStream.Arn
        LambdaName: !Sub "${AWS::StackName}-DriftDetector"
        LogRetentionDays: !Ref LogRetentionDays
        EnableSplunk: true
        IncludeAdditionalPolicies: true
        AdditionalPolicies: !Join
          - ","
          - - !GetAtt DetectStackDriftPolicy.PolicyArn

  # policy that config uses to check for drift detection
  DetectStackDriftPolicy:
    Condition: ShouldDeployDriftDetection
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:DetectStackResourceDrift
              - cloudformation:DetectStackDrift
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackResources
              - cloudformation:BatchDescribeTypeConfigurations
              - cloudformation:DescribeStackResourceDrifts
              - cloudformation:DescribeStackDriftDetectionStatus
              - cloudformation:ListStackInstanceResourceDrifts
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:*"

  # role for drift detection
  IamRoleForDriftDetection:
    Condition: ShouldDeployDriftDetection
    Type: AWS::IAM::Role
    Properties:
      Description: IAM role for AWS Config to access CloudFormation drift detection
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - !Ref DetectStackDriftPolicy

  # rules to check drift on all our stacks
  ConfigRuleToDetectCfnDriftPSU:
    Condition: ShouldDeployDriftDetection
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-CloudFormationDriftDetector-PSU
      Description: AWS Config rule to detect drift in CloudFormation stacks
      Scope:
        TagKey: cfnDriftDetectionGroup
        TagValue: psu
      Source:
        Owner: AWS
        SourceIdentifier: CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK
      MaximumExecutionFrequency: TwentyFour_Hours
      InputParameters:
        cloudformationRoleArn: !GetAtt IamRoleForDriftDetection.Arn

  ConfigRuleToDetectCfnDriftCPT:
    Condition: ShouldDeployDriftDetection
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-CloudFormationDriftDetector-CPT
