AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Splunk Firehose Transformer, Certificate Checker, Slack Alerter, Lambda Janitor, Proxygen Lambdas

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Architectures:
      - x86_64
    Runtime: nodejs24.x
    Environment:
      Variables:
        NODE_OPTIONS: "--enable-source-maps"
        ENV: !Ref Env
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:580247275435:layer:LambdaInsightsExtension:60

Parameters:
  SplunkHECEndpoint:
    Type: String
    Description: HEC Endpoint for Cloudformation to Splunk Firehose
    Default: none
  LogRetentionDays:
    Type: Number
    Description: How long to keep logs for
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1096,
        1827,
        2192,
        2557,
        2922,
        3288,
        3653,
      ]
  LogLevel:
    Type: String
    Description: The log level to set in the lambda
    Default: "INFO"
  Env:
    Type: String
    Description: The environment the lambda is deployed to
    Default: "dev"
  LambdaInsightsLogGroupName:
    Type: String
    Description: The log level to set in the lambda

  DeployDriftDetection:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Whether to enable or disable drift detection.

Conditions:
  ShouldDeployDriftDetection: !Equals [true, !Ref DeployDriftDetection]

Resources:
  ##################################################
  #region Lambda Insights
  ##################################################
  LambdaInsightsCloudwatchLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      guard:
        SuppressedRules:
          - CW_LOGGROUP_RETENTION_PERIOD_CHECK
    Properties:
      LogGroupName: !Ref LambdaInsightsLogGroupName
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn

  LambdaInsightsLogGroupPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt LambdaInsightsCloudwatchLogGroup.Arn
          - Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GenerateDataKey*
              - kms:Encrypt
              - kms:ReEncrypt*
            Resource: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
  #endregion

  ##################################################
  #region Splunk Subscription Filter
  ##################################################
  SplunkSubscriptionFilterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action:
              - sts:AssumeRole

  SplunkSubscriptionFilterDeliveryStreamManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkSubscriptionFilterRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - firehose:PutRecord
            Resource:
              - !GetAtt SplunkDeliveryStream.Arn

  SplunkSubscriptionFilterKMSManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkSubscriptionFilterRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - kms:GenerateDataKey
            Resource:
              - !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
  #endregion

  ##################################################
  #region Splunk Delivery Stream
  ##################################################
  SplunkDeliveryStream:
    # Depends on policy as delivery streams require a role with correct policies to be build, and a role reference doesn't provide a dependency as Stream -> Role <- Policy, so Stream -!> Policy
    DependsOn:
      - SplunkDeliveryStreamProcessorInvokeManagedPolicy
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      SplunkDestinationConfiguration:
        HECEndpoint: !Ref SplunkHECEndpoint
        HECEndpointType: "Event"
        HECToken: "{{resolve:secretsmanager:account-resources-SplunkHECToken:SecretString}}"
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt SplunkDeliveryStreamProcessor.Arn
                - ParameterName: RoleArn
                  ParameterValue: !GetAtt SplunkDeliveryStreamProcessorInvokeRole.Arn
        S3Configuration:
          BucketARN: !ImportValue account-resources-cdk-uk:Bucket:SplunkDeliveryStreamBackupBucket:Arn
          RoleARN: !ImportValue account-resources-cdk-uk:IAM:SplunkDeliveryStreamBackupBucketRole:Arn
          Prefix: !Ref "AWS::StackName"
          EncryptionConfiguration:
            KMSEncryptionConfig:
              AWSKMSKeyARN: !ImportValue account-resources-cdk-uk:KMS:SplunkDeliveryStreamBackupKMSKey:Arn
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref SplunkDeliveryStreamLogGroup
          LogStreamName: !Ref SplunkDeliveryStreamLogStream

  SplunkDeliveryStreamLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      guard:
        SuppressedRules:
          - CW_LOGGROUP_RETENTION_PERIOD_CHECK
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${AWS::StackName}-SplunkDeliveryStream"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn

  SplunkDeliveryStreamLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref SplunkDeliveryStreamLogGroup

  SplunkDeliveryStreamLoggingManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !ImportValue account-resources-cdk-uk:IAM:SplunkDeliveryStreamBackupBucketRole:Name
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SplunkDeliveryStreamLogGroup}"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SplunkDeliveryStreamLogGroup}:log-stream:*"
          - Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GenerateDataKey*
              - kms:Encrypt
              - kms:ReEncrypt*
            Resource:
              - !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
  #endregion

  ##################################################
  #region Splunk Delivery Stream Processor
  ##################################################
  SplunkDeliveryStreamProcessor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../packages/
      Handler: splunkProcessor.handler
      Role: !GetAtt SplunkDeliveryStreamProcessorRole.Arn
      MemorySize: 512
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      guard:
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        packages: bundle
        EntryPoints:
          - splunkProcessor/src/splunkProcessor.js

  SplunkDeliveryStreamProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole

  SplunkDeliveryStreamProcessorLambdaManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkDeliveryStreamProcessorRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SplunkDeliveryStreamProcessorLogGroup}"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SplunkDeliveryStreamProcessorLogGroup}:log-stream:*"

  SplunkDeliveryStreamProcessorKMSManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkDeliveryStreamProcessorRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GenerateDataKey*
              - kms:Encrypt
              - kms:ReEncrypt*
            Resource:
              - !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn

  SplunkDeliveryStreamProcessorDeliveryStreamManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkDeliveryStreamProcessorRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - firehose:PutRecordBatch
            Resource:
              - !GetAtt SplunkDeliveryStream.Arn

  SplunkDeliveryStreamProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      guard:
        SuppressedRules:
          - CW_LOGGROUP_RETENTION_PERIOD_CHECK
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SplunkDeliveryStreamProcessor}"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
  #endregion

  ##################################################
  #region Splunk Delivery Stream Processor Invoke
  ##################################################
  SplunkDeliveryStreamProcessorInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action:
              - sts:AssumeRole

  SplunkDeliveryStreamProcessorInvokeManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref SplunkDeliveryStreamProcessorInvokeRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt SplunkDeliveryStreamProcessor.Arn
  #endregion

  ##################################################
  #region Certificate Checker
  ##################################################
  CertificateCheckerManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !ImportValue secrets-cdk:Secrets:ClinicalTrackerCACertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:ClinicalTrackerClientCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:ClinicalTrackerClientSandboxCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PfpCACertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PfpClientCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PfpClientSandboxCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PsuCACertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PsuClientCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:PsuClientSandboxCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:FhirFacadeCACertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:FhirFacadeClientCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:FhirFacadeClientSandboxCertSecret:Arn
              - !ImportValue secrets-cdk:Secrets:SpinePublicCertificate:Arn
              - !ImportValue secrets-cdk:Secrets:ptlPrescriptionSigningPublicKey:Arn
          - Effect: Allow
            Action:
              - secretsmanager:BatchGetSecretValue
            Resource: "*"

  ExpiryFunctionResources:
    Type: AWS::Serverless::Application
    DependsOn:
      - SplunkSubscriptionFilterDeliveryStreamManagedPolicy
    Properties:
      Location: common_lambda_resources.yml
      Parameters:
        CloudWatchKMSKey: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
        SplunkSubscriptionFilterRole: !GetAtt SplunkSubscriptionFilterRole.Arn
        SplunkDeliveryStream: !GetAtt SplunkDeliveryStream.Arn
        LambdaName: !Sub "${AWS::StackName}-CertificateChecker"
        LogRetentionDays: !Ref LogRetentionDays
        EnableSplunk: true
        IncludeAdditionalPolicies: true
        AdditionalPolicies: !Join
          - ","
          - - !GetAtt CertificateCheckerManagedPolicy.PolicyArn

  CertExpiryCheckFunctionScheduleEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CertExpiryCheckFunctionScheduleEventRolePolicy

  CertExpiryCheckFunctionScheduleEventRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt CertExpiryCheckFunction.Arn

  CertExpiryCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-CertificateChecker"
      CodeUri: ../packages/
      Handler: certificateChecker.handler
      Role: !GetAtt ExpiryFunctionResources.Outputs.LambdaRoleArn
      Events:
        ScheduleEvent:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-CertExpirySchedule
            ScheduleExpression: "rate(1 day)"
            RoleArn: !GetAtt CertExpiryCheckFunctionScheduleEventRole.Arn
            Input: !Sub
              - "{\"secretARNs\": [ \
                \"${ClinicalTrackerCACertSecret}\", \
                \"${ClinicalTrackerClientCertSecret}\", \
                \"${ClinicalTrackerClientSandboxCertSecret}\", \
                \"${PfpCACertSecret}\", \
                \"${PfpClientCertSecret}\", \
                \"${PfpClientSandboxCertSecret}\", \
                \"${PsuCACertSecret}\", \
                \"${PsuClientCertSecret}\", \
                \"${PsuClientSandboxCertSecret}\", \
                \"${FhirFacadeCACertSecret}\", \
                \"${FhirFacadeClientCertSecret}\", \
                \"${FhirFacadeClientSandboxCertSecret}\", \
                \"${SpinePublicCertificate}\", \
                \"${ptlPrescriptionSigningPublicKey}\" ]}"
              - ClinicalTrackerCACertSecret: !ImportValue secrets-cdk:Secrets:ClinicalTrackerCACertSecret:Arn
                ClinicalTrackerClientCertSecret: !ImportValue secrets-cdk:Secrets:ClinicalTrackerClientCertSecret:Arn
                ClinicalTrackerClientSandboxCertSecret: !ImportValue secrets-cdk:Secrets:ClinicalTrackerClientSandboxCertSecret:Arn
                PfpCACertSecret: !ImportValue secrets-cdk:Secrets:PfpCACertSecret:Arn
                PfpClientCertSecret: !ImportValue secrets-cdk:Secrets:PfpClientCertSecret:Arn
                PfpClientSandboxCertSecret: !ImportValue secrets-cdk:Secrets:PfpClientSandboxCertSecret:Arn
                PsuCACertSecret: !ImportValue secrets-cdk:Secrets:PsuCACertSecret:Arn
                PsuClientCertSecret: !ImportValue secrets-cdk:Secrets:PsuClientCertSecret:Arn
                PsuClientSandboxCertSecret: !ImportValue secrets-cdk:Secrets:PsuClientSandboxCertSecret:Arn
                FhirFacadeCACertSecret: !ImportValue secrets-cdk:Secrets:FhirFacadeCACertSecret:Arn
                FhirFacadeClientCertSecret: !ImportValue secrets-cdk:Secrets:FhirFacadeClientCertSecret:Arn
                FhirFacadeClientSandboxCertSecret: !ImportValue secrets-cdk:Secrets:FhirFacadeClientSandboxCertSecret:Arn
                SpinePublicCertificate: !ImportValue secrets-cdk:Secrets:SpinePublicCertificate:Arn
                ptlPrescriptionSigningPublicKey: !ImportValue secrets-cdk:Secrets:ptlPrescriptionSigningPublicKey:Arn
    Metadata:
      BuildMethod: esbuild
      guard:
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        tsconfig: certificateChecker/tsconfig.json
        packages: bundle
        EntryPoints:
          - certificateChecker/src/certificateChecker.ts
  #endregion

  ##################################################
  #region Slack Alerter
  ###################################################
  SlackAlertsSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-SlackAlerts
      KmsMasterKeyId: !ImportValue account-resources-cdk-uk:KMS:SnsAlertKMSKey:Arn
      DeliveryStatusLogging:
        - Protocol: sqs
          SuccessFeedbackRoleArn: !ImportValue account-resources-cdk-uk:IAM:SNSAlertLoggingRole:Arn
          FailureFeedbackRoleArn: !ImportValue account-resources-cdk-uk:IAM:SNSAlertLoggingRole:Arn

  # todo add deliver status logging

  SlackAlerterSqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-SlackAlerts
      KmsMasterKeyId: !ImportValue account-resources-cdk-uk:KMS:SqsAlertKMSKey:Arn
      MessageRetentionPeriod: 86400 # 1day in secs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SlackAlerterDeadLetterQueue.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 60

  SlackAlerterSqsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !GetAtt SlackAlerterSqsQueue.QueueUrl
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SendMessage
            Resource: !GetAtt SlackAlerterSqsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt SlackAlertsSnsTopic.TopicArn

  SlackAlerterDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-SlackAlertsDeadLetter
      KmsMasterKeyId: !ImportValue account-resources-cdk-uk:KMS:SqsAlertKMSKey:Arn
      MessageRetentionPeriod: 604800 # 1week in secs
      VisibilityTimeout: 60

  SlackAlerterDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !GetAtt SlackAlerterDeadLetterQueue.QueueUrl
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SendMessage
            Resource: !GetAtt SlackAlerterDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt SlackAlerterSqsQueue.Arn

  SlackAlerterSqsQueueSnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !GetAtt SlackAlertsSnsTopic.TopicArn
      RawMessageDelivery: true
      Protocol: sqs
      Endpoint: !GetAtt SlackAlerterSqsQueue.Arn

  ReadSlackAlerterSqsQueuePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:ReceiveMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueues
            Resource: !GetAtt SlackAlerterSqsQueue.Arn

  ReadSuppressionSSMParameterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/monitoring-alertSuppressions
  
  SlackAlerterResources:
    Type: AWS::Serverless::Application
    Properties:
      Location: common_lambda_resources.yml
      Parameters:
        CloudWatchKMSKey: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
        SplunkSubscriptionFilterRole: !GetAtt SplunkSubscriptionFilterRole.Arn
        SplunkDeliveryStream: !GetAtt SplunkDeliveryStream.Arn
        LambdaName: !Sub "${AWS::StackName}-SlackAlerter"
        LogRetentionDays: !Ref LogRetentionDays
        EnableSplunk: true
        IncludeAdditionalPolicies: true
        AdditionalPolicies: !Join
          - ","
          - - !ImportValue account-resources-cdk-uk:IAM:SqsAlertDecryptSecretsKMSPolicy:Arn
            - !ImportValue secrets-cdk:IAM:AccessSlackSecretsManagedPolicy:Arn
            - !GetAtt ReadSlackAlerterSqsQueuePolicy.PolicyArn
            - !GetAtt ReadSuppressionSSMParameterPolicy.PolicyArn

  SlackAlerter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SlackAlerter
      CodeUri: ../packages
      Handler: slackAlerter.handler
      Role: !GetAtt SlackAlerterResources.Outputs.LambdaRoleArn
      Environment:
        Variables:
          PARAMETERS_SECRETS_EXTENSION_HTTP_PORT: 2773
      Layers:
        - arn:aws:lambda:eu-west-2:133256977650:layer:AWS-Parameters-and-Secrets-Lambda-Extension:20
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt SlackAlerterSqsQueue.Arn
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            BatchSize: 10
    Metadata:
      BuildMethod: esbuild
      guard:
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        tsconfig: slackAlerter/tsconfig.json
        packages: bundle
        EntryPoints:
          - slackAlerter/src/slackAlerter.ts

  #endregion

  ##################################################
  #region Lambda Janitor
  ##################################################
  LambdaJanitor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-LambdaJanitor
      CodeUri: ../packages
      Handler: janitor.handler
      Role: !GetAtt LambdaJanitorResources.Outputs.LambdaRoleArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          FUNCTION_ARN: !ImportValue fhir-validator:FHIRValidatorUKCoreLambdaArn
          VERSIONS_TO_KEEP: 3
      Events:
        ScheduledEvent:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-LambdaJanitorSchedule
            ScheduleExpression: "cron(0 6 ? * WED *)"
            RoleArn: !GetAtt LambdaJanitorScheduleEventRole.Arn
    Metadata:
      BuildMethod: esbuild
      guard:
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
          - LAMBDA_CONCURRENCY_CHECK
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        tsconfig: lambdaJanitor/tsconfig.json
        packages: bundle
        EntryPoints:
          - lambdaJanitor/src/janitor.ts

  LambdaJanitorResources:
    Type: AWS::Serverless::Application
    Properties:
      Location: common_lambda_resources.yml
      Parameters:
        CloudWatchKMSKey: !ImportValue account-resources-cdk-uk:KMS:CloudwatchLogsKmsKey:Arn
        SplunkSubscriptionFilterRole: !GetAtt SplunkSubscriptionFilterRole.Arn
        SplunkDeliveryStream: !GetAtt SplunkDeliveryStream.Arn
        LambdaName: !Sub "${AWS::StackName}-LambdaJanitor"
        LogRetentionDays: !Ref LogRetentionDays
        EnableSplunk: true
        IncludeAdditionalPolicies: true
        AdditionalPolicies: !Join
          - ","
          - - !GetAtt FHIRValidatorListLambdaPolicy.PolicyArn
            - !GetAtt FHIRValidatorDeleteVersionPolicy.PolicyArn

  FHIRValidatorListLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:ListVersionsByFunction
            Resource: !ImportValue fhir-validator:FHIRValidatorUKCoreLambdaArn

  FHIRValidatorDeleteVersionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:DeleteFunction
            Resource:
              !Join [
                "",
                [
                  !ImportValue fhir-validator:FHIRValidatorUKCoreLambdaArn,
                  ":*",
                ],
              ]

  LambdaJanitorScheduleEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaJanitorScheduleEventRolePolicy

  LambdaJanitorScheduleEventRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt LambdaJanitor.Arn
  #endregion

  ##################################################
  #region Proxygen lambdas
  ##################################################
  ExecuteProxygenPTLManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !ImportValue iam-cdk:IAM:ProxygenPTLRole:Name
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt ProxygenPTLInstancePutFunction.Arn
              - !GetAtt ProxygenPTLMTLSSecretPutFunction.Arn
              - !GetAtt ProxygenPTLSpecPublishFunction.Arn
              - !GetAtt ProxygenPTLInstanceGetFunction.Arn
              - !GetAtt ProxygenPTLInstanceDeleteFunction.Arn

  ExecuteProxygenProdManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
